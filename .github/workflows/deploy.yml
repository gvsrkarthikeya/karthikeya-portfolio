name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: node scripts/github-private-stats.mjs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - run: npm run build -- --configuration production --base-href /karthikeya-portfolio/
      # Pages has no SPA fallback; serving index.html as 404.html makes deep links like /github work.
      - run: cp dist/karthikeya-portfolio/browser/index.html dist/karthikeya-portfolio/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/karthikeya-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
