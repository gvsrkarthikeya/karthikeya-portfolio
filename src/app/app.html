<app-scroll-progress />
<a class="skip-link visually-hidden-focusable" href="#main-content" (click)="skipToMain($event)"
  >Skip to main content</a
>
<app-site-header [brand]="profile.displayName" [navItems]="navItems">
  <button
    type="button"
    class="btn btn-outline-secondary palette-trigger"
    aria-label="Open command palette"
    aria-haspopup="dialog"
    (click)="palette.show()"
  >
    <span aria-hidden="true">⌕</span> <kbd>{{ shortcut }}</kbd>
  </button>
  <app-style-selector
    [style]="appearance.designStyle()"
    (changed)="appearance.setDesignStyle($event)"
  />
  <app-theme-toggle headerAction [theme]="appearance.colorTheme()" (toggled)="toggleTheme()" />
</app-site-header>
<main id="main-content" class="app-shell container" tabindex="-1">
  <router-outlet />
</main>
<app-site-footer [ownerName]="profile.displayName" />
<app-back-to-top />
<app-command-palette [navItems]="paletteItems" [profile]="profile" />
