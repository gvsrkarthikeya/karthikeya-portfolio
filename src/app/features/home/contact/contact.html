<section appReveal id="contact" class="section py-5" aria-labelledby="contact-heading">
  <h2 id="contact-heading" class="h3 fw-bold mb-3">Contact</h2>
  <p class="mb-3">Open to conversations about frontend engineering and AI-assisted development.</p>
  <div class="d-flex flex-wrap align-items-center gap-3">
    <app-social-links [links]="profile().socialLinks" />
    @if (profile().resumeUrl; as resume) {
      <a
        class="contact__resume"
        [href]="resume"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Download resume (PDF, opens in a new tab)"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"
          />
          <path
            d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"
          />
        </svg>
        <span>Resume</span>
      </a>
    }
  </div>
</section>
