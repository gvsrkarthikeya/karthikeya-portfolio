<section id="skills" class="section py-5" aria-labelledby="skills-heading">
  <h2 id="skills-heading" class="h3 fw-bold mb-4">Skills</h2>
  <div class="row g-3">
    @for (group of groups(); track group.title) {
      <div class="col-12 col-md-6">
        <div class="skills__group h-100 p-3">
          <h3 class="h6 text-uppercase text-body-secondary mb-3">{{ group.title }}</h3>
          <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0">
            @for (skill of group.skills; track skill.name) {
              <li class="skills__tag">{{ skill.name }}</li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</section>
