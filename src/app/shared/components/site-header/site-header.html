<header class="site-header border-bottom">
  <div class="container">
    <div class="navbar navbar-expand-lg px-0">
      <a class="navbar-brand fw-semibold" routerLink="/" (click)="closeMenu()">{{ brand() }}</a>
      <div class="site-header__action">
        <ng-content select="[headerAction]" />
      </div>
      <button
        type="button"
        class="navbar-toggler site-header__toggle"
        aria-controls="primary-menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <nav
        id="primary-menu"
        class="collapse navbar-collapse justify-content-lg-end"
        [class.show]="menuOpen()"
        aria-label="Primary"
      >
        <ul class="navbar-nav">
          @for (item of navItems(); track item.label) {
            <li class="nav-item" [class.nav-item--pages]="startsPages($index)">
              <a
                class="nav-link"
                [class.active]="isActive(item)"
                [attr.aria-current]="isActive(item) ? 'page' : null"
                [routerLink]="'/' + item.path"
                [fragment]="item.fragment"
                (click)="closeMenu()"
                >{{ item.label }}</a
              >
            </li>
          }
        </ul>
        <div class="site-header__controls">
          <ng-content />
        </div>
      </nav>
    </div>
  </div>
</header>
