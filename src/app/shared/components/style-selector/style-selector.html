<button
  #trigger
  type="button"
  class="btn btn-outline-secondary style-selector__trigger"
  aria-haspopup="menu"
  aria-label="Design style"
  [attr.aria-expanded]="isOpen()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span>{{ currentLabel() }}</span>
  <svg
    viewBox="0 0 16 16"
    width="12"
    height="12"
    fill="currentColor"
    aria-hidden="true"
    focusable="false"
  >
    <path
      d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"
    />
  </svg>
</button>
@if (isOpen()) {
  <div
    class="style-selector__menu"
    role="menu"
    aria-label="Design style"
    (keydown)="onMenuKeydown($event)"
  >
    @for (option of options; track option.value) {
      <button
        type="button"
        role="menuitemradio"
        class="style-selector__item"
        [attr.aria-checked]="option.value === style()"
        (click)="select(option.value)"
      >
        <span class="style-selector__check" aria-hidden="true">{{
          option.value === style() ? '✓' : ''
        }}</span>
        {{ option.label }}
      </button>
    }
  </div>
}
